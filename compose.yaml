# Local services for blog-post. Dev and prod both use Compose Postgres —
# no bare installs, no SQLite. The app service lands in task 05.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-blog}
      POSTGRES_USER: ${POSTGRES_USER:-blog}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-blog} -d $${POSTGRES_DB:-blog}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
